name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt
        run: cargo fmt --all -- --check

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # tao + rfd link GTK, wry links WebKitGTK, tao's tray links
      # ayatana-appindicator. The same set release.yml installs.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: build
        run: cargo build --locked
      - name: test
        run: cargo test --all

  # The restore/freeze boundary is the product — an unverified live
  # restore is a broken window. Runs only on Windows: the probes drive a
  # real WebView2 and its message pump, and runners have the runtime.
  live-probes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: live freeze probe
        run: cargo test live_freeze_memory -- --ignored --nocapture
        env:
          CRYO_FREEZE_CASE: heap
      - name: live budget + restore probe
        run: cargo test live_ram_budget -- --ignored --nocapture
