name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  required-check:
    name: check
    runs-on: ubuntu-latest
    needs: [fmt, check, chrome, signing, live-probes]
    if: ${{ always() }}
    steps:
      - name: Require every CI gate
        shell: bash
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            test "$result" = success || exit 1
          done

  fmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt
        run: cargo fmt --all -- --check

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # tao + rfd link GTK, wry links WebKitGTK, tao's tray links
      # ayatana-appindicator. The same set release.yml installs.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: build
        run: cargo build --locked
      - name: test
        run: cargo test --all

      # Issue #33: a window that dies before it exists passed every gate
      # because none of them opened one. Under Xvfb the debug binary must
      # still be alive a few seconds in — enough to catch that class.
      - name: Smoke — window stays up (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          set +e
          xvfb-run -a timeout -k 5 8 target/debug/cryo
          rc=$?
          set -e
          # 124 is timeout killing a still-living process — the pass case.
          # Anything earlier is a dead window and a failed gate.
          if [ "$rc" -ne 124 ]; then
            echo "cryo exited before the window could live ($rc)"
            exit 1
          fi

      - name: Upload linux debug binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cryo-linux-debug
          path: target/debug/cryo

  # The chrome render script is JavaScript inside the Rust tree, so cargo
  # never sees it. tests/*.test.cjs drive it under jsdom and cover the
  # pointer-activation regression from v0.9.0 — ungated, it rots.
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: install
        run: npm ci
      - name: test
        run: npm test

  # Release signing is the one path no release can rehearse: it only runs
  # when a certificate exists, so an untested change to it surfaces during a
  # release. The tests sign real PE files with throwaway self-signed certs,
  # which covers everything except a chain to a public root.
  signing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: sign.ps1
        shell: powershell
        run: .\installer\sign.tests.ps1
      - name: msix pack.ps1
        shell: powershell
        run: .\installer\msix\pack.tests.ps1

  # The restore/freeze boundary is the product — an unverified live
  # restore is a broken window. Runs only on Windows: the probes drive a
  # real WebView2 and its message pump, and runners have the runtime.
  live-probes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: live freeze probe
        run: cargo test live_freeze_memory -- --ignored --nocapture
        env:
          CRYO_FREEZE_CASE: heap
      - name: live find probe
        run: cargo test live_find_in_page -- --ignored --nocapture
      - name: live budget + restore probe
        run: cargo test live_ram_budget -- --ignored --nocapture
