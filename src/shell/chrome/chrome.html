<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/theme/icon-glacier.svg">
<link rel="stylesheet" href="/theme/tokens.css">
<script src="/theme/theme.js"></script>
<link rel="stylesheet" href="/chrome/chrome.css">
</head>
<body>
  <div id="bar">
    <button class="nav" id="back" title="Back (Alt+Left), right-click for history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
    <button class="nav" id="fwd" title="Forward (Alt+Right), right-click for history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></button>
    <button class="nav" id="reload" title="Reload (F5)"><svg class="ic-reload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3.5v4h-4"/></svg><svg class="ic-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    <div id="tabs"></div>
    <button id="new-tab" title="New tab (Ctrl+T)">+</button>
    <div id="omni">
      <button id="site" title="View site information" aria-label="View site information">
        <svg class="ic-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <svg class="ic-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        <svg class="ic-cryo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5"/></svg>
      </button>
      <input id="url" type="text" spellcheck="false"
             placeholder="Search or enter address">
    </div>
    <button class="nav" id="star" title="Bookmark this page (Ctrl+D)">★</button>
    <button id="signin" title="Sign in with your Google account">Sign in</button>
    <button class="nav" id="dl" title="Downloads" hidden><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1.5v6.8"/><path d="M3.8 5.2 7 8.4l3.2-3.2"/><path d="M2 11.5h10"/></svg><svg class="ring" viewBox="0 0 24 24" aria-hidden="true"><circle class="ring-track" cx="12" cy="12" r="9.5"/><circle class="ring-prog" cx="12" cy="12" r="9.5"/></svg></button>
    <button class="nav" id="menu" title="Menu">⋮</button>
  </div>
  <div id="loadbar"><i></i></div>
  <div id="dial"></div>
  <div id="menu-pop"></div>
  <div id="nav-pop" role="menu" aria-label="Session history"></div>
  <div id="acct-pop"></div>
  <div id="omni-pop"></div>
  <div id="site-pop" role="dialog" aria-label="Site information"></div>
  <div id="dl-pop"></div>
  <div id="lib">
    <div class="panel">
      <header>
        <div class="brand"><span class="brand-mark">❄</span><span>Cryo library</span></div>
        <nav aria-label="Library sections">
          <button class="tab-btn" data-pane="bookmarks">Bookmarks</button>
          <button class="tab-btn" data-pane="passwords">Passwords</button>
          <button class="tab-btn" data-pane="history">History</button>
          <button class="tab-btn" data-pane="tasks">Tasks</button>
          <button class="tab-btn" data-pane="downloads">Downloads</button>
          <button class="tab-btn" data-pane="extensions">Extensions</button>
          <button class="tab-btn" data-pane="import">Import</button>
          <button class="tab-btn" data-pane="export">Export</button>
        </nav>
        <button class="close" title="Close (Esc)" aria-label="Close library">×</button>
      </header>
      <div class="body"></div>
    </div>
  </div>
  <div id="tabfind" role="dialog" aria-label="Find a tab">
    <div class="panel">
      <input type="text" spellcheck="false" autocomplete="off"
             aria-label="Find a tab by name or address"
             placeholder="Find a tab by name or address">
      <div class="results" role="listbox" aria-label="Open tabs"></div>
      <div class="count" aria-live="polite"></div>
    </div>
  </div>
  <div id="install-pop" role="dialog" aria-live="polite"></div>
  <div id="password-pop" role="dialog" aria-live="polite"></div>
  <div id="permission-pop" role="dialog" aria-live="polite"></div>
  <div id="toast"></div>
  <div id="findbar" role="search" aria-label="Find in page" hidden>
    <input type="search" aria-label="Find in page" placeholder="Find in page"
           autocomplete="off" spellcheck="false" maxlength="2048">
    <output aria-live="polite"></output>
    <label title="Match case"><input type="checkbox" aria-label="Match case">Aa</label>
    <button type="button" data-find="previous" aria-label="Previous match" title="Previous (Shift+Enter)">↑</button>
    <button type="button" data-find="next" aria-label="Next match" title="Next (Enter)">↓</button>
    <button type="button" data-find="close" aria-label="Close find" title="Close (Escape)">×</button>
  </div>
<script src="/chrome/chrome.js"></script>
</body>
</html>
