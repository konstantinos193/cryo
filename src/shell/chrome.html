<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  /* Glacial dark: one blue-tinted neutral ramp, one ice accent, and
     depth from lighter surfaces + frosted blur rather than shadows. */
  :root {
    color-scheme: dark;
    --bg0: #0b0e12;
    --bg1: #11141a;
    --bg2: #181d25;
    --bg3: #202631;
    --line: #262d38;
    --line-soft: rgba(255, 255, 255, .06);
    --tx: #e9edf2;
    --tx2: #98a1ae;
    --tx3: #67707d;
    --ice: #8fdcf0;
    --ice-deep: #2b7186;
    --ice-dim: #17455a;
    --ok: #5fcf8f;
    --bad: #e07b7b;
    --pop-bg: rgba(24, 29, 37, .92);
    --shadow: 0 18px 50px rgba(0, 0, 0, .55), 0 2px 10px rgba(0, 0, 0, .4);
  }
  body {
    color: var(--tx);
    font: 12px/1.45 system-ui, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: #2c333f; border-radius: 5px; border: 2px solid transparent;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: #39414f; }
  ::-webkit-scrollbar-track { background: transparent; }
  /* The visible strip. The view is transparent and grows over the whole
     window while the menu is open — everything outside #bar and the popup
     must stay unpainted so the page shows through. */
  #bar {
    position: fixed; top: 0; left: 0; right: 0; height: 44px;
    display: flex; align-items: center; gap: 6px;
    padding: 0 8px;
    background: linear-gradient(180deg, #161a21 0%, var(--bg1) 100%);
  }
  /* The speed-dial row — offsets must match BAR_HEIGHT / DIAL_HEIGHT in
     shell::mod. Painted like #bar: the view is transparent, so an
     unpainted row would let the page show through. */
  #dial {
    position: fixed; top: 44px; left: 0; right: 0; height: 32px;
    display: flex; align-items: center; gap: 3px;
    background: var(--bg1); padding: 0 8px; overflow: hidden;
    border-top: 1px solid var(--line-soft);
  }
  .dial {
    display: flex; align-items: center; gap: 7px; flex: 0 0 auto;
    height: 25px; padding: 0 10px 0 5px; border: 0; border-radius: 7px;
    background: transparent; color: var(--tx); font: inherit; cursor: pointer;
    white-space: nowrap; transition: background .12s ease;
  }
  .dial:hover { background: var(--bg3); }
  .dial .dot {
    display: flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 5px;
    background: var(--ice-dim); color: var(--ice); font-size: 11px; font-weight: 600;
  }
  #tabs { display: flex; gap: 5px; overflow: hidden; flex: 0 1 auto; }
  .tab {
    display: flex; align-items: center; gap: 6px;
    max-width: 180px; padding: 6px 9px;
    background: var(--bg2); border: 1px solid transparent; border-radius: 9px;
    cursor: default; white-space: nowrap; transition: background .12s ease;
  }
  .tab:hover { background: var(--bg3); }
  .tab.active {
    background: #262d3a; border-color: var(--line);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
  }
  .tab .title { overflow: hidden; text-overflow: ellipsis; }
  .tab .x { color: var(--tx3); padding: 0 3px; border-radius: 4px; }
  .tab .x:hover { background: rgba(224, 123, 123, .18); color: #f0b4b4; }
  /* The site icon at the tab's leading edge. */
  .tab .fav {
    width: 14px; height: 14px; flex: 0 0 auto; border-radius: 4px;
  }
  /* The per-tab freeze button. */
  .tab .fz {
    color: var(--ice); opacity: .8; padding: 0 3px; border-radius: 4px;
    cursor: default;
  }
  .tab .fz:hover { background: rgba(143, 220, 240, .14); opacity: 1; }
  /* A frozen tab shows the same flake as a static state marker. */
  .tab .fzmark { color: var(--ice); opacity: .8; padding: 0 3px; }
  .tab.frozen .title { color: #9db4c0; font-style: italic; }
  .tab.discarded .title { color: var(--tx3); }
  .nav, #new-tab {
    flex: 0 0 auto; width: 27px; height: 27px; border: 0; border-radius: 7px;
    background: transparent; color: var(--tx); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s ease;
  }
  .nav:hover, #new-tab:hover { background: var(--bg3); }
  .nav { font-size: 14px; }
  .nav svg { width: 15px; height: 15px; }
  /* No history to step into — the arrow greys out instead of no-op'ing. */
  .nav:disabled { color: #4a515d; cursor: default; }
  .nav:disabled:hover { background: transparent; }
  /* Reload ↔ stop: one button, two glyphs — loading swaps them. */
  #reload .ic-stop { display: none; }
  #reload.loading .ic-reload { display: none; }
  #reload.loading .ic-stop { display: block; }
  /* The load bar: an indeterminate strip sliding along the bar's bottom
     edge while the active tab loads. */
  #loadbar {
    position: fixed; top: 42px; left: 0; right: 0; height: 2px;
    overflow: hidden; pointer-events: none;
  }
  #loadbar i {
    position: absolute; top: 0; left: -35%; height: 2px; width: 35%;
    background: var(--ice); border-radius: 1px; opacity: 0;
    box-shadow: 0 0 6px rgba(143, 220, 240, .6);
  }
  #loadbar.on i { opacity: 1; animation: loadslide 1s ease-in-out infinite; }
  @keyframes loadslide {
    0%   { left: -35%; width: 35%; }
    60%  { left: 60%;  width: 45%; }
    100% { left: 100%; width: 30%; }
  }
  /* The loading spinner that replaces a tab's favicon. */
  .tab .spin {
    width: 12px; height: 12px; flex: 0 0 auto; border-radius: 50%;
    border: 2px solid #39414f; border-top-color: var(--ice);
    animation: tabspin .7s linear infinite;
  }
  @keyframes tabspin { to { transform: rotate(360deg); } }
  #url {
    flex: 1 1 auto; min-width: 120px; height: 30px;
    background: var(--bg2); border: 1px solid var(--line-soft); border-radius: 15px;
    color: var(--tx); padding: 0 14px; font: inherit; outline: none;
    transition: border-color .12s ease, box-shadow .12s ease, background .12s ease;
    -webkit-user-select: text; user-select: text;
  }
  #url:hover { border-color: var(--line); }
  #url:focus {
    background: var(--bg0); border-color: var(--ice-deep);
    box-shadow: 0 0 0 3px rgba(143, 220, 240, .14);
  }
  #url::placeholder { color: var(--tx3); }
  #signin {
    flex: 0 0 auto; height: 26px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 13px;
    background: transparent; color: var(--ice); font: inherit; cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  #signin:hover { background: rgba(143, 220, 240, .1); border-color: var(--ice-deep); }
  /* Signed in: the pill collapses to a bare round button holding the
     account picture (or the name's initial), like Chrome's avatar. */
  #signin.signed { padding: 1px; border-color: transparent; }
  #signin .ava { width: 22px; height: 22px; border-radius: 50%; display: block; }
  #signin .initial {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--ice-deep); color: #eaf9fd; font-size: 12px;
  }
  /* Downloads button: hidden until a file starts; the thin bar under
     the glyph is aggregate in-flight progress. */
  #dl { position: relative; }
  #dl svg, .dl-row .act svg { display: block; margin: 0 auto; }
  /* First appearance and each new transfer pop the icon. */
  @keyframes dlpop {
    0% { transform: scale(.4); } 60% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  #dl.pop { animation: dlpop .35s ease-out; }
  #dl .bar {
    position: absolute; left: 5px; bottom: 3px; height: 2px; width: 0;
    background: var(--ice); border-radius: 1px; transition: width .15s linear;
  }
  /* No declared size: the fill can't be computed, so a segment sweeps
     the track instead — something visibly alive while bytes move. */
  #dl .bar.ind { animation: dlsweep 1.1s ease-in-out infinite; }
  @keyframes dlsweep {
    0% { left: 5px; } 50% { left: 60%; } 100% { left: 5px; }
  }
  /* A row that just finished flashes once. */
  @keyframes dlflash {
    0% { background: rgba(95, 207, 143, .26); } 100% { background: transparent; }
  }
  .dl-row.flash { animation: dlflash .9s ease-out; }
  #dl-pop {
    display: none; position: fixed; top: 40px; right: 36px; z-index: 10;
    min-width: 280px; max-width: 360px; max-height: 320px; overflow-y: auto;
    padding: 5px;
    background: var(--pop-bg); border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 12px; box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
  }
  #dl-pop.open { display: block; }
  .dl-row { padding: 8px 10px; border-radius: 8px; }
  .dl-row:hover { background: rgba(255, 255, 255, .04); }
  .dl-row .top { display: flex; align-items: center; gap: 8px; }
  .dl-row .nm {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dl-row .act {
    flex: 0 0 auto; border: 0; border-radius: 6px; padding: 3px 6px;
    background: transparent; color: var(--tx2); font-size: 12px; cursor: pointer;
    transition: background .12s ease;
  }
  .dl-row .act:hover { background: var(--bg3); color: #fff; }
  .dl-row .meta { margin-top: 2px; color: var(--tx3); font-size: 11px; }
  /* A finished row is both a link and a drag source. */
  .dl-row.done { cursor: grab; }
  .dl-row.done .nm { cursor: pointer; }
  .dl-row.done .nm:hover { color: var(--ice); }
  .dl-row .act.retry { padding: 3px 9px; }
  #menu-pop {
    display: none; position: fixed; top: 40px; right: 8px; z-index: 10;
    min-width: 240px; padding: 5px;
    background: var(--pop-bg); border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 12px; box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
  }
  #menu-pop.open, #omni-pop.open { display: block; }
  /* The omnibox dropdown anchors under the toolbar (top = BAR_HEIGHT)
     and positions itself over the dial bar like every browser's does. */
  #omni-pop {
    display: none; position: fixed; top: 44px; z-index: 10;
    padding: 5px;
    background: var(--pop-bg); border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 12px; box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
  }
  .mi {
    padding: 8px 12px; border-radius: 8px; cursor: default;
    white-space: nowrap; transition: background .1s ease;
  }
  .mi:hover, .mi.sel { background: rgba(255, 255, 255, .06); }
  .mi.sel { color: #fff; }
  .mi.off { color: var(--tx3); }
  .mi.off:hover { background: transparent; }
  .mi.upd { color: var(--ok); }
  #menu { position: relative; }
  #menu.has-update::after {
    content: ''; position: absolute; top: 4px; right: 4px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok); box-shadow: 0 0 5px rgba(95, 207, 143, .8);
  }
  .omni-row { display: flex; align-items: center; gap: 9px; }
  /* The row's leading slot: the site's favicon when history holds one,
     a glyph for the search/go verdict, else a letter dot — same look
     the dial bar gives its entries. */
  .omni-row .ic { width: 15px; height: 15px; flex: 0 0 auto; border-radius: 4px; }
  .omni-row .glyph { color: var(--tx2); }
  .omni-row .glyph svg { display: block; width: 15px; height: 15px; }
  .omni-row .dot {
    display: flex; align-items: center; justify-content: center;
    background: var(--ice-dim); color: var(--ice); font-size: 10px; font-weight: 600;
  }
  .omni-row .lbl {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sep { height: 1px; background: var(--line-soft); margin: 5px 8px; }
  /* ★: fills in while the active page is kept. */
  #star { color: var(--tx3); font-size: 15px; }
  #star.on { color: #f0c65e; text-shadow: 0 0 8px rgba(240, 198, 94, .35); }
  /* The bar's trailing "»" into the library panel. */
  .dial.all { color: var(--tx3); padding: 0 9px; }
  .dial.all:hover { color: var(--tx); }
  /* The library panel. Fills the window while it is open — the app has
     stretched this view over everything by then — and dims what is
     behind it so the page does not read as interactive. */
  #lib {
    display: none; position: fixed; inset: 0; z-index: 20;
    background: rgba(5, 7, 10, .66); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    align-items: center; justify-content: center;
  }
  #lib.open { display: flex; }
  #lib .panel {
    display: flex; flex-direction: column;
    width: min(1040px, calc(100vw - 48px)); height: min(740px, calc(100vh - 64px));
    background: #12151c; border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 20px;
    box-shadow: 0 32px 90px rgba(0, 0, 0, .7), 0 0 0 1px rgba(0, 0, 0, .3);
    overflow: hidden;
  }
  #lib header {
    display: flex; align-items: center; gap: 18px;
    min-height: 62px; padding: 10px 18px; border-bottom: 1px solid var(--line-soft);
    background: linear-gradient(180deg, rgba(255,255,255,.03), transparent);
  }
  #lib .brand {
    display: flex; align-items: center; gap: 10px; min-width: 160px;
    color: #f3f7fb; font-size: 14px; font-weight: 650; letter-spacing: .01em;
  }
  #lib .brand-mark {
    display: grid; place-items: center; width: 30px; height: 30px;
    border: 1px solid rgba(143, 220, 240, .35); border-radius: 9px;
    background: linear-gradient(145deg, #1b4356, #14202a); color: var(--ice);
    box-shadow: 0 0 12px rgba(143, 220, 240, .12);
  }
  #lib nav {
    display: flex; align-items: center; gap: 2px; padding: 3px;
    background: var(--bg0); border: 1px solid var(--line-soft); border-radius: 11px;
  }
  #lib .tab-btn {
    border: 0; border-radius: 8px; padding: 7px 13px;
    background: transparent; color: var(--tx2); font: inherit; cursor: pointer;
    transition: color .12s ease, background .12s ease;
  }
  #lib .tab-btn:hover { color: var(--tx); }
  #lib .tab-btn.on {
    background: var(--bg3); color: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  }
  #lib .close {
    display: grid; place-items: center; margin-left: auto; width: 32px; height: 32px;
    border: 0; border-radius: 9px; background: transparent; color: var(--tx2);
    font: inherit; font-size: 18px; line-height: 1; cursor: pointer;
    transition: background .12s ease;
  }
  #lib .close:hover { background: var(--bg3); color: #fff; }
  #lib .body { flex: 1; min-height: 0; padding: 18px 20px 22px; overflow-y: auto; }
  #lib .body.bookmarks-body { padding: 0; overflow: hidden; }
  #lib .search {
    width: 100%; height: 30px; margin: 2px 0 10px;
    background: var(--bg0); border: 1px solid var(--line); border-radius: 9px;
    color: var(--tx); padding: 0 11px; font: inherit; outline: none;
    transition: border-color .12s ease, box-shadow .12s ease;
    -webkit-user-select: text; user-select: text;
  }
  #lib .search:focus {
    border-color: var(--ice-deep);
    box-shadow: 0 0 0 3px rgba(143, 220, 240, .12);
  }
  .lrow {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 8px; border-radius: 9px;
    transition: background .1s ease;
  }
  .lrow + .lrow { margin-top: 1px; }
  .lrow:hover { background: rgba(255, 255, 255, .04); }
  .lrow .main { flex: 1 1 auto; min-width: 0; }
  .lrow .t, .lrow .u {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lrow .u { color: var(--tx3); font-size: 11px; }
  .lrow .fold {
    flex: 0 0 auto; color: #7fb6c9; font-size: 11px; max-width: 160px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lrow .dots {
    flex: 0 0 auto; color: var(--tx2); font-family: ui-monospace, Consolas, monospace;
    -webkit-user-select: text; user-select: text;
  }
  .lbtn {
    flex: 0 0 auto; border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 11px; background: transparent; color: var(--tx);
    font: inherit; cursor: pointer; transition: background .12s ease, border-color .12s ease;
  }
  .lbtn:hover { background: var(--bg3); border-color: #3a4250; color: #fff; }
  .lbtn.warn { color: #e3a9a9; border-color: rgba(224, 123, 123, .3); }
  .lbtn.warn:hover { background: rgba(224, 123, 123, .12); border-color: rgba(224, 123, 123, .45); }
  .lhead {
    margin: 18px 4px 7px; color: var(--tx3); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .09em;
  }
  .lhead:first-child { margin-top: 4px; }
  .lnote { margin: 8px 4px; color: var(--tx3); line-height: 1.55; }
  .lnote.warn { color: #e3a9a9; }
  .lempty { padding: 18px 4px; color: var(--tx3); }
  /* Bookmarks are a retrieval surface, not a settings table. Folder
     scope stays visible on the left while results scroll on the right. */
  .bookmark-shell { display: flex; height: 100%; min-height: 0; }
  .bookmark-folders {
    width: 210px; flex: 0 0 auto; padding: 24px 12px 18px;
    overflow-y: auto; border-right: 1px solid var(--line-soft); background: #0e1116;
  }
  .bookmark-folders h3 {
    margin: 0 10px 12px; color: var(--tx3); font-size: 10px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
  }
  .folder-btn {
    display: flex; align-items: center; gap: 9px; width: 100%; min-width: 0;
    padding: 8px 10px; border: 0; border-radius: 8px; background: transparent;
    color: var(--tx2); font: inherit; text-align: left; cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .folder-btn:hover { background: rgba(255, 255, 255, .05); color: var(--tx); }
  .folder-btn.on {
    background: rgba(143, 220, 240, .1); color: var(--ice);
    box-shadow: inset 2px 0 0 var(--ice-deep);
  }
  .folder-btn svg { width: 15px; height: 15px; flex: 0 0 auto; }
  .folder-btn .folder-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder-btn .folder-count {
    margin-left: auto; color: var(--tx3); font-size: 10px; font-variant-numeric: tabular-nums;
  }
  .folder-btn.on .folder-count { color: #83b9c4; }
  .bookmark-main { display: flex; flex: 1; min-width: 0; flex-direction: column; }
  .bookmark-top { padding: 25px 28px 17px; border-bottom: 1px solid var(--line-soft); }
  .bookmark-titlebar { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 17px; }
  .bookmark-titlebar h2 { color: #f2f5f8; font-size: 20px; line-height: 1.2; font-weight: 650; letter-spacing: -.01em; }
  .bookmark-subtitle { margin-top: 4px; color: var(--tx3); font-size: 11px; }
  .bookmark-import { margin-left: auto; }
  .bookmark-search-row { display: flex; align-items: center; gap: 10px; }
  .bookmark-search-wrap { position: relative; flex: 1; }
  .bookmark-search-wrap svg {
    position: absolute; left: 12px; top: 50%; width: 15px; height: 15px;
    color: var(--tx3); transform: translateY(-50%); pointer-events: none;
  }
  #lib .bookmark-search {
    width: 100%; height: 38px; padding: 0 38px 0 36px;
    border: 1px solid var(--line); border-radius: 11px; outline: none;
    background: var(--bg0); color: var(--tx); font: inherit;
    transition: border-color .12s ease, box-shadow .12s ease;
    -webkit-user-select: text; user-select: text;
  }
  #lib .bookmark-search:focus {
    border-color: var(--ice-deep);
    box-shadow: 0 0 0 3px rgba(143, 220, 240, .12);
  }
  .search-clear {
    display: none; position: absolute; right: 7px; top: 6px; width: 26px; height: 26px;
    border: 0; border-radius: 7px; background: transparent; color: var(--tx3); cursor: pointer;
  }
  .search-clear.show { display: block; }
  .search-clear:hover { background: var(--bg3); color: #fff; }
  /* The custom dropdown — a real <select>'s popup renders natively and
     can't carry the theme, so sort (and settings' engine pick) are
     button + listbox built here. */
  .xdrop { position: relative; flex: 0 0 auto; }
  .xdrop-btn {
    display: flex; align-items: center; gap: 8px; height: 38px;
    padding: 0 12px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--bg0); color: var(--tx2); font: inherit; cursor: pointer;
    transition: border-color .12s ease, color .12s ease;
  }
  .xdrop-btn:hover { border-color: #3a4250; color: var(--tx); }
  .xdrop.open .xdrop-btn {
    border-color: var(--ice-deep);
    box-shadow: 0 0 0 3px rgba(143, 220, 240, .12); color: var(--tx);
  }
  .xdrop-btn svg {
    width: 12px; height: 12px; color: var(--tx3);
    transition: transform .15s ease;
  }
  .xdrop.open .xdrop-btn svg { transform: rotate(180deg); }
  .xdrop-pop {
    display: none; position: absolute; top: calc(100% + 6px); right: 0; z-index: 5;
    min-width: 100%; padding: 5px;
    background: var(--pop-bg); border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 11px; box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
  }
  .xdrop.open .xdrop-pop { display: block; }
  .xdrop-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border: 0; border-radius: 7px; background: transparent;
    color: var(--tx2); font: inherit; text-align: left; cursor: pointer;
    white-space: nowrap; transition: background .1s ease, color .1s ease;
  }
  .xdrop-item:hover, .xdrop-item.sel { background: rgba(255, 255, 255, .06); color: var(--tx); }
  .xdrop-item.on { color: var(--ice); }
  .xdrop-item.on::before { content: '✓'; font-size: 10px; }
  .xdrop-item:not(.on)::before { content: ''; width: 10px; }
  .bookmark-results { flex: 1; min-height: 0; padding: 12px 18px 18px; overflow-y: auto; }
  .bookmark-summary { padding: 2px 10px 9px; color: var(--tx3); font-size: 10px; }
  .bookmark-card {
    display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 10px;
    border: 1px solid transparent; border-radius: 11px; cursor: pointer; outline: none;
    transition: background .12s ease, border-color .12s ease;
  }
  .bookmark-card:hover, .bookmark-card:focus { background: rgba(255,255,255,.04); border-color: var(--line); }
  .site-mark {
    display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 auto;
    border: 1px solid rgba(255,255,255,.08); border-radius: 10px;
    color: #e8f4f7; font-size: 13px; font-weight: 700; text-transform: uppercase;
  }
  .site-fav { width: 20px; height: 20px; border-radius: 5px; }
  .bookmark-copy { flex: 1; min-width: 0; }
  .bookmark-name { overflow: hidden; color: var(--tx); font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .bookmark-meta { display: flex; align-items: center; gap: 7px; margin-top: 3px; min-width: 0; color: var(--tx3); font-size: 10px; }
  .bookmark-host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bookmark-folder-pill {
    max-width: 190px; padding: 1px 6px; overflow: hidden; border-radius: 5px;
    background: var(--bg3); color: var(--tx2); text-overflow: ellipsis; white-space: nowrap;
  }
  .bookmark-actions { display: flex; align-items: center; gap: 3px; opacity: 0; transition: opacity .12s ease; }
  .bookmark-card:hover .bookmark-actions, .bookmark-card:focus-within .bookmark-actions { opacity: 1; }
  .icon-btn {
    display: grid; place-items: center; width: 30px; height: 30px; border: 0;
    border-radius: 8px; background: transparent; color: var(--tx3); cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .icon-btn:hover { background: var(--bg3); color: var(--tx); }
  .icon-btn.danger:hover { background: rgba(224, 123, 123, .14); color: #f1a5aa; }
  .icon-btn svg { width: 15px; height: 15px; pointer-events: none; }
  .delete-check { display: flex; align-items: center; gap: 5px; color: #d7a2a5; font-size: 10px; }
  .delete-check button { padding: 5px 8px; border: 0; border-radius: 7px; font: inherit; cursor: pointer; }
  .delete-check .yes { background: rgba(224, 123, 123, .3); color: #fff; }
  .delete-check .no { background: var(--bg3); color: var(--tx); }
  .bookmark-empty { display: grid; place-items: center; height: 100%; min-height: 220px; text-align: center; }
  .bookmark-empty-mark {
    display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 12px;
    border-radius: 14px; background: var(--bg2); border: 1px solid var(--line-soft);
    color: #6f98a3; font-size: 22px;
  }
  .bookmark-empty h3 { color: #d8dde4; font-size: 13px; }
  .bookmark-empty p { max-width: 330px; margin-top: 5px; color: var(--tx3); font-size: 11px; line-height: 1.5; }
  @media (max-width: 720px) {
    #lib .panel { width: calc(100vw - 20px); height: calc(100vh - 20px); }
    #lib .brand { min-width: auto; }
    #lib .brand span:last-child { display: none; }
    #lib header { gap: 8px; padding-inline: 10px; }
    #lib .tab-btn { padding-inline: 8px; }
    .bookmark-folders { width: 54px; padding-inline: 7px; }
    .bookmark-folders h3, .folder-name, .folder-count { display: none; }
    .folder-btn { justify-content: center; padding-inline: 8px; }
    .bookmark-top { padding: 18px 16px 14px; }
  }
  /* What an import or export did. Sits bottom-right, out of the way of
     the panel's own content, and times itself out. */
  #toast {
    display: none; position: fixed; right: 14px; bottom: 14px; z-index: 30;
    max-width: 380px; padding: 11px 14px;
    background: var(--pop-bg); border: 1px solid rgba(255, 255, 255, .09);
    border-left: 3px solid var(--ok); border-radius: 11px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
  }
  #toast.open { display: block; }
  #toast.bad { border-left-color: var(--bad); }
  #toast .tt { font-weight: 600; }
  #toast .tl { color: var(--tx2); font-size: 11px; margin-top: 2px; }
</style>
</head>
<body>
  <div id="bar">
    <button class="nav" id="back" title="Back (Alt+Left)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
    <button class="nav" id="fwd" title="Forward (Alt+Right)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></button>
    <button class="nav" id="reload" title="Reload (F5)"><svg class="ic-reload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3.5v4h-4"/></svg><svg class="ic-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    <div id="tabs"></div>
    <button id="new-tab" title="New tab (Ctrl+T)">+</button>
    <input id="url" type="text" spellcheck="false"
           placeholder="Search or enter address">
    <button class="nav" id="star" title="Bookmark this page (Ctrl+D)">★</button>
    <button id="signin" title="Sign in with your Google account">Sign in</button>
    <button class="nav" id="dl" title="Downloads" hidden><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1.5v6.8"/><path d="M3.8 5.2 7 8.4l3.2-3.2"/><path d="M2 11.5h10"/></svg><i class="bar"></i></button>
    <button class="nav" id="menu" title="Menu">⋮</button>
  </div>
  <div id="loadbar"><i></i></div>
  <div id="dial"></div>
  <div id="menu-pop"></div>
  <div id="omni-pop"></div>
  <div id="dl-pop"></div>
  <div id="lib">
    <div class="panel">
      <header>
        <div class="brand"><span class="brand-mark">❄</span><span>Cryo library</span></div>
        <nav aria-label="Library sections">
          <button class="tab-btn" data-pane="bookmarks">Bookmarks</button>
          <button class="tab-btn" data-pane="passwords">Passwords</button>
          <button class="tab-btn" data-pane="history">History</button>
          <button class="tab-btn" data-pane="import">Import</button>
          <button class="tab-btn" data-pane="export">Export</button>
        </nav>
        <button class="close" title="Close (Esc)" aria-label="Close library">×</button>
      </header>
      <div class="body"></div>
    </div>
  </div>
  <div id="toast"></div>
<script>
  // wry's window.ipc channel is dead on this backend: attaching
  // with_ipc_handler leaves the document's own scripts unexecuted.
  // Commands go over the internal protocol instead — POSTs to /cmd land
  // in the engine's page resolver and reach the app unchanged.
  const ipc = (obj) => fetch('/cmd', {method: 'POST', body: JSON.stringify(obj)});
  const tabsEl = document.getElementById('tabs');
  const urlEl = document.getElementById('url');
  // The default search engine pick lives in the shell origin's
  // localStorage (the settings page writes it): a preset slug or a
  // custom %s URL template. The app can't see the storage area, so
  // commands that consult it carry the current value — read fresh each
  // time, a change in /settings lands with the next keystroke.
  const enginePick = () => localStorage.getItem('cryo.searchEngine');
  ipc({cmd: 'ready', engine: enginePick()});

  const backBtn = document.getElementById('back');
  const fwdBtn = document.getElementById('fwd');
  const reloadBtn = document.getElementById('reload');
  const loadbar = document.getElementById('loadbar');
  document.getElementById('new-tab').onclick = () => ipc({cmd: 'new_tab'});
  backBtn.onclick = () => ipc({cmd: 'back'});
  fwdBtn.onclick = () => ipc({cmd: 'forward'});
  // One button, two jobs: while a page loads it's the stop control.
  reloadBtn.onclick = () =>
    ipc({cmd: reloadBtn.classList.contains('loading') ? 'stop' : 'reload'});
  document.getElementById('signin').onclick = () => ipc({cmd: 'sign_in'});

  const menuPop = document.getElementById('menu-pop');
  const omniPop = document.getElementById('omni-pop');
  const dlPop = document.getElementById('dl-pop');
  const dlBtn = document.getElementById('dl');
  // Popups live in this document, but the view's bounds are only the
  // strip — a view can't paint outside them. While any overlay (menu,
  // omnibox, downloads) is open the app raises this view above the
  // content and stretches it over the whole window; the aggregate state
  // is reported so the bounds stay in sync. Clicks anywhere outside a
  // popup land on this document and dismiss.
  let menuOpen = false, omniOpen = false, dlOpen = false, libOpen = false;
  const reportOverlay = () =>
    ipc({cmd: 'overlay', open: menuOpen || omniOpen || dlOpen || libOpen});
  const setMenu = (open) => {
    if (open === menuOpen) return;
    menuOpen = open;
    menuPop.classList.toggle('open', open);
    reportOverlay();
  };
  const setOmni = (open) => {
    if (open === omniOpen) return;
    omniOpen = open;
    omniPop.classList.toggle('open', open);
    reportOverlay();
  };
  const setDl = (open) => {
    if (open === dlOpen) return;
    dlOpen = open;
    dlPop.classList.toggle('open', open);
    reportOverlay();
  };
  // The library panel: bookmarks, saved passwords, import and export.
  // It is a chrome overlay like the others — the app stretches this view
  // over the window while it is up — but it fills the window rather
  // than hanging off a button, and it asks the app for the pane's data
  // every time it opens so it never shows a stale list.
  const setLib = (open) => {
    if (open === libOpen) return;
    libOpen = open;
    libEl.classList.toggle('open', open);
    // A revealed password lives as long as the panel does.
    if (!open) revealed.clear();
    reportOverlay();
  };
  const openLib = (pane) => {
    setMenu(false); setOmni(false); setDl(false);
    libPane = pane;
    // Start the pane empty rather than showing the last one's rows for
    // the frame before the app's push lands.
    libData = {pane, bookmarks: [], passwords: [], history: [], sources: [],
               more_bookmarks: 0, more_passwords: 0, more_history: 0,
               locked: null, sources_ready: false, incognito: libData.incognito};
    libFilter = '';
    setLib(true);
    paintLib();
    ipc({cmd: 'library', pane});
  };
  // Ctrl+Shift+O lands here.
  window.__cryo_library_toggle = (pane) => {
    if (libOpen && (!pane || pane === libPane)) { setLib(false); return; }
    openLib(pane || 'bookmarks');
  };
  // The app calls this when it replaces what's on screen (tab switch,
  // navigation, fullscreen) — the document can't see those actions.
  window.__cryo_overlay = (open) => {
    if (!open) { setMenu(false); setOmni(false); setDl(false); setLib(false); }
  };
  // Ctrl+J lands here — the engine's own downloads page is kept shut by
  // stealing the chord in key_command; this shelf is the replacement.
  window.__cryo_downloads = () => {
    setMenu(false); setOmni(false);
    setDl(!dlOpen);
  };
  // Last pushed state — menu guards (freeze/discard need a second tab to
  // hand focus to) read it at click time.
  let lastState = {tabs: []};
  const hasNeighbour = () => lastState.tabs.length > 1;
  const MENU = [
    {label: 'Freeze tab (Ctrl+Shift+F)', cmd: {cmd: 'freeze'}, ok: hasNeighbour},
    {label: 'Discard tab', cmd: {cmd: 'discard'}, ok: hasNeighbour},
    'sep',
    {label: 'Bookmark this page (Ctrl+D)', cmd: {cmd: 'bookmark_page'}},
    {label: 'Bookmarks (Ctrl+Shift+O)', lib: 'bookmarks'},
    {label: 'History (Ctrl+H)', lib: 'history'},
    {label: 'Saved passwords', lib: 'passwords'},
    {label: 'Import browser data…', lib: 'import'},
    {label: 'Export browser data…', lib: 'export'},
    'sep',
    {label: 'New incognito window (Ctrl+Shift+N)', cmd: {cmd: 'new_incognito'}},
    {label: 'DevTools (F12)', cmd: {cmd: 'devtools'}},
    {label: 'Clear browsing data (Ctrl+Shift+Del)', cmd: {cmd: 'clear_data'}},
    'sep',
    {label: 'Settings', cmd: {cmd: 'settings'}},
    {label: 'Extensions — not supported (needs Chromium)', off: true},
    'sep',
    {label: 'Check for updates', cmd: {cmd: 'check_updates'}},
  ];
  // The update item lives outside MENU: it only exists while a verified
  // installer is staged, and its label carries the version. __cryo_update
  // creates/refreshes it.
  let updateItem = document.createElement('div');
  updateItem.className = 'mi upd';
  updateItem.onclick = () => { setMenu(false); ipc({cmd: 'update_apply'}); };
  for (const item of MENU) {
    if (item === 'sep') {
      const s = document.createElement('div');
      s.className = 'sep';
      menuPop.appendChild(s);
      continue;
    }
    const el = document.createElement('div');
    el.className = 'mi' + (item.off ? ' off' : '');
    el.textContent = item.label;
    if (!item.off) el.onclick = () => {
      setMenu(false);
      // Items can refuse at click time when the state forbids them —
      // the app would no-op anyway, but a dead click shouldn't look live.
      if (item.ok && !item.ok()) return;
      // `lib` items open a library pane — they carry no `cmd` because
      // openLib posts the pane's `library` command itself.
      if (item.lib) {
        openLib(item.lib);
        return;
      }
      ipc(item.cmd);
    };
    menuPop.appendChild(el);
  }
  document.getElementById('menu').onclick = (e) => {
    e.stopPropagation();
    setDl(false); setOmni(false);
    setMenu(!menuOpen);
  };
  dlBtn.onclick = (e) => {
    e.stopPropagation();
    setMenu(false); setOmni(false);
    setDl(!dlOpen);
  };
  // Row buttons live inside the pop — clicks there must not bubble to
  // the document's dismiss-all. The menu needs it too: its `lib` items
  // open the library, and a click that reaches the document would shut
  // the panel in the same gesture that opened it.
  dlPop.onclick = (e) => e.stopPropagation();
  menuPop.onclick = (e) => e.stopPropagation();
  document.addEventListener('click', () => {
    setMenu(false); setOmni(false); setDl(false); setLib(false);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      setMenu(false); setOmni(false); setDl(false); setLib(false);
    }
  });

  // The dial list feeds the bar below; omnibox suggestions are computed
  // app-side instead — history never reaches this document.
  let dialEntries = [];

  // Omnibox dropdown: each keystroke asks the app, __cryo_suggest paints
  // the reply. Rows keep `input` — what gets sent back through navigate.
  let omniSel = -1;
  let omniRows = [];
  // What the user typed before arrows started browsing rows — cycling
  // back off the list (or Escape) restores it.
  let omniTyped = null;

  // Fallback glyphs for the verdict row — a magnifier for searches, a
  // globe for navigations. Sites without a remembered favicon get a
  // letter dot instead.
  const GLYPHS = {
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.3 16.3 21 21"/></svg>',
    go: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3c2.6 2.8 4 5.6 4 9s-1.4 6.2-4 9c-2.6-2.8-4-5.6-4-9s1.4-6.2 4-9z"/></svg>',
    bookmark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.8-5.1 2.8 1-5.7-4.1-4 5.7-.8z"/></svg>',
  };

  const go = (input, e) => {
    ipc({cmd: 'navigate', input,
         ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey,
         engine: enginePick()});
    urlEl.blur();
  };

  const paintSel = () => {
    [...omniPop.children].forEach((el, i) =>
      el.classList.toggle('sel', i === omniSel));
  };

  const renderOmni = () => {
    const q = urlEl.value.trim();
    omniSel = -1;
    omniTyped = null;
    if (!q) {
      omniRows = [];
      omniPop.innerHTML = '';
      setOmni(false);
      return;
    }
    // The old rows stay until the reply lands — clearing them here
    // would flash an empty popup on every keystroke.
    ipc({cmd: 'suggest', q, engine: enginePick()});
  };

  const omniIcon = (r) => {
    if (r.icon) {
      const img = document.createElement('img');
      img.className = 'ic'; img.src = r.icon; img.alt = '';
      return img;
    }
    const ic = document.createElement('span');
    if (GLYPHS[r.kind]) {
      ic.className = 'ic glyph';
      ic.innerHTML = GLYPHS[r.kind];
    } else {
      ic.className = 'ic dot';
      ic.textContent = (r.label[0] || '?').toUpperCase();
    }
    return ic;
  };

  window.__cryo_suggest = (reply) => {
    // Drop a stale reply — the user typed on or blurred meanwhile.
    if (document.activeElement !== urlEl || urlEl.value.trim() !== reply.q) {
      return;
    }
    omniSel = -1;
    omniRows = reply.rows.slice(0, 8);
    omniPop.innerHTML = '';
    for (const r of omniRows) {
      const el = document.createElement('div');
      el.className = 'mi omni-row';
      const lbl = document.createElement('span');
      lbl.className = 'lbl';
      lbl.textContent = r.label;
      el.append(omniIcon(r), lbl);
      // mousedown beats blur — preventDefault keeps the input focused so
      // the click lands instead of the popup closing under it.
      el.onmousedown = (e) => e.preventDefault();
      el.onclick = (e) => { e.stopPropagation(); go(r.input, e); };
      omniPop.appendChild(el);
    }
    if (!omniRows.length) { setOmni(false); return; }
    const rect = urlEl.getBoundingClientRect();
    omniPop.style.left = rect.left + 'px';
    omniPop.style.width = rect.width + 'px';
    setOmni(true);
  };

  urlEl.addEventListener('input', renderOmni);
  urlEl.addEventListener('focus', renderOmni);
  urlEl.addEventListener('blur', () => setOmni(false));

  urlEl.addEventListener('keydown', (e) => {
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && omniOpen) {
      const n = omniRows.length;
      if (!n) return;
      e.preventDefault();
      if (omniSel === -1) omniTyped = urlEl.value;
      // Down cycles through the rows and off the end back to the typed
      // text; Up does the same in reverse — the box mirrors the row.
      if (e.key === 'ArrowDown') {
        omniSel = omniSel + 1 >= n ? -1 : omniSel + 1;
      } else {
        omniSel = omniSel === -1 ? n - 1 : omniSel - 1;
      }
      urlEl.value = omniSel === -1 ? omniTyped : omniRows[omniSel].input;
      urlEl.select();
      paintSel();
      return;
    }
    // Chrome's inline autocompletion: at the end of the input, → or End
    // accepts the top completable row — the typed text stays, the tail
    // arrives selected so typing overwrites it.
    if ((e.key === 'ArrowRight' || e.key === 'End') &&
        urlEl.selectionStart === urlEl.value.length &&
        urlEl.selectionEnd === urlEl.value.length) {
      const v = urlEl.value.toLowerCase();
      const row = omniRows.find((r) =>
        r.complete && r.complete.length > v.length &&
        r.complete.toLowerCase().startsWith(v));
      if (row) {
        e.preventDefault();
        urlEl.value = row.complete;
        urlEl.setSelectionRange(v.length, row.complete.length);
      }
      return;
    }
    if (e.key === 'Enter') {
      go(omniSel >= 0 ? omniRows[omniSel].input : urlEl.value, e);
    } else if (e.key === 'Escape' && omniTyped !== null) {
      // Arrow-browsing filled the box — give the typed text back before
      // the document handler tucks the popup.
      urlEl.value = omniTyped;
      omniTyped = null;
    } else if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'l') {
      // Edge's paste-and-go.
      navigator.clipboard.readText().then((t) => {
        if (t) {
          ipc({cmd: 'navigate', input: t, engine: enginePick()});
          urlEl.blur();
        }
      }).catch(() => {});
      e.preventDefault();
    }
  });

  // Dial bar: the same pinned list the new-tab tiles render. A click
  // navigates the active tab — favorites-bar behaviour; Ctrl or middle
  // click opens a new tab and Ctrl+Shift a background one, expressed
  // through the navigate command's modifier fields (policy stays in app).
  fetch('/dials').then(r => r.json()).then(dials => {
    dialEntries = dials;
    renderBar(lastState.bookmarks || []);
  }).catch(() => {});

  // One row, two sources: kept bookmarks once there are any, the pinned
  // dial list until then — a fresh profile still has somewhere to click.
  // Both speak the same two clicks: open here, or Ctrl/middle for a tab.
  const renderBar = (bookmarks) => {
    const bar = document.getElementById('dial');
    bar.innerHTML = '';
    const rows = bookmarks.length
      ? bookmarks.map((b) => ({name: b.title, url: b.url, id: b.id, icon: b.favicon}))
      : dialEntries.map((d) => ({name: d.name, url: d.url, id: null, icon: null}));
    for (const r of rows) {
      const el = document.createElement('button');
      el.className = 'dial';
      el.title = r.url + '\nClick: open here · Ctrl/middle-click: new tab' +
                 (r.id === null ? '' : ' · right-click: remove');
      // A kept page paints the site's icon; everything else keeps the
      // letter tile.
      let dot;
      if (r.icon) {
        dot = document.createElement('img');
        dot.src = r.icon;
        dot.alt = '';
        dot.draggable = false;
      } else {
        dot = document.createElement('span');
        dot.textContent = (r.name || r.url).charAt(0).toUpperCase();
      }
      dot.className = 'dot';
      const label = document.createElement('span');
      label.textContent = r.name || r.url;
      el.append(dot, label);
      // A bookmark goes through its own command so the app resolves the
      // id; a dial is just an address.
      el.onclick = (e) => r.id === null
        ? ipc({cmd: 'navigate', input: r.url, alt: e.ctrlKey, shift: e.shiftKey})
        : ipc({cmd: 'bookmark_open', id: r.id, ctrl: e.ctrlKey, shift: e.shiftKey});
      el.onauxclick = (e) => {
        if (e.button !== 1) return;
        if (r.id === null) ipc({cmd: 'navigate', input: r.url, alt: true});
        else ipc({cmd: 'bookmark_open', id: r.id, ctrl: true});
      };
      if (r.id !== null) {
        el.oncontextmenu = (e) => {
          e.preventDefault();
          ipc({cmd: 'bookmark_remove', id: r.id});
        };
      }
      bar.appendChild(el);
    }
    // The bar's own way into the panel, like every browser's "»".
    const all = document.createElement('button');
    all.className = 'dial all';
    all.title = 'Bookmarks, passwords, import and export (Ctrl+Shift+O)';
    all.textContent = bookmarks.length ? '»' : '★ »';
    all.onclick = () => openLib('bookmarks');
    bar.appendChild(all);
  };

  // Browser shortcuts are not handled here — the engine forwards every
  // accelerator to the app before the page sees it, for chrome and content
  // views alike.

  // Download shelf: the ⬇ button appears once the first file lands;
  // the bar under the glyph is aggregate in-flight progress.
  const fmtBytes = (n) => {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return Math.round(n / 1024) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
  };

  let dlCloseTimer = null;

  const renderDl = (dls, prev) => {
    const prevDls = prev.downloads || [];
    const wasProg = new Set(
      prevDls.filter((d) => d.state === 'progress').map((d) => d.key));
    const prevState = new Map(prevDls.map((d) => [d.key, d.state]));
    const nowProg = dls.filter((d) => d.state === 'progress');

    dlBtn.hidden = !dls.length;

    // A download that wasn't in flight last update just started: pop
    // the icon and open the shelf, the way Chrome opens its bubble.
    const started = nowProg.some((d) => !wasProg.has(d.key));
    if (started) {
      dlBtn.classList.remove('pop');
      void dlBtn.offsetWidth;   // restart the animation
      dlBtn.classList.add('pop');
      setDl(true);
      if (dlCloseTimer) { clearTimeout(dlCloseTimer); dlCloseTimer = null; }
    }
    // The last transfer settled — the shelf lingers a beat, then tucks.
    if (!nowProg.length && wasProg.size && dlOpen && !dlCloseTimer) {
      dlCloseTimer = setTimeout(() => {
        dlCloseTimer = null;
        if (dlOpen) setDl(false);
      }, 3000);
    }

    // Aggregate bar under the glyph: mean of known shares, or the
    // sweeping segment when nothing declares a size.
    let share = 0, parts = 0;
    for (const d of nowProg) {
      if (d.total) { share += d.received / d.total; parts++; }
    }
    const any = nowProg.length > 0;
    const bar = dlBtn.querySelector('.bar');
    bar.style.width = any ? Math.round((parts ? share / parts : 0.4) * 100) + '%' : '0';
    bar.classList.toggle('ind', any && !parts);

    dlPop.innerHTML = '';
    if (!dls.length) {
      const empty = document.createElement('div');
      empty.className = 'mi off';
      empty.textContent = 'No downloads';
      dlPop.appendChild(empty);
    }
    // One row verb per state: progress pauses or dies, paused resumes,
    // done opens/drags/reveals, dead ones retry.
    const act = (title, glyph, cmd) => {
      const b = document.createElement('button');
      b.className = 'act';
      b.title = title;
      b.innerHTML = glyph;
      b.onclick = cmd;
      return b;
    };
    const IC = {
      pause: '<svg width="12" height="12" viewBox="0 0 14 14" fill="currentColor"><rect x="3.5" y="2.5" width="2.6" height="9" rx="1"/><rect x="7.9" y="2.5" width="2.6" height="9" rx="1"/></svg>',
      play: '<svg width="12" height="12" viewBox="0 0 14 14" fill="currentColor"><path d="M4 2.5v9a1 1 0 0 0 1.52.85l6.8-4.5a1 1 0 0 0 0-1.7l-6.8-4.5A1 1 0 0 0 4 2.5z"/></svg>',
      folder: '<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M1.5 3.5h4l1.5 1.8h5.5v5.9h-11z"/></svg>',
    };
    // A finished file drags out for real: press and move a few px and
    // the app takes over with a native OLE drag — drop on a folder to
    // copy, drop back on this strip to open the file in a tab.
    const armDrag = (el, key) => {
      el.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || e.target.closest('.act')) return;
        const x0 = e.clientX, y0 = e.clientY;
        const cleanup = () => {
          el.removeEventListener('pointermove', move);
          el.removeEventListener('pointerup', cleanup);
          el.removeEventListener('pointercancel', cleanup);
        };
        const move = (ev) => {
          if (Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) < 5) return;
          cleanup();
          ipc({cmd: 'download_drag', key});
        };
        el.addEventListener('pointermove', move);
        el.addEventListener('pointerup', cleanup);
        el.addEventListener('pointercancel', cleanup);
      });
    };
    for (const d of dls) {
      const row = document.createElement('div');
      row.className = 'dl-row' + (d.state === 'done' ? ' done' : '');
      // progress → done between updates gets one green flash.
      if (prevState.get(d.key) === 'progress' && d.state === 'done') {
        row.classList.add('flash');
      }
      const top = document.createElement('div');
      top.className = 'top';
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = d.name;
      nm.title = d.path;
      top.appendChild(nm);
      if (d.state === 'progress') {
        top.appendChild(act('Pause', IC.pause, () => ipc({cmd: 'download_pause', key: d.key})));
        top.appendChild(act('Cancel', '×', () => ipc({cmd: 'download_cancel', key: d.key})));
      } else if (d.state === 'paused') {
        top.appendChild(act('Resume', IC.play, () => ipc({cmd: 'download_resume', key: d.key})));
        top.appendChild(act('Cancel', '×', () => ipc({cmd: 'download_cancel', key: d.key})));
      } else if (d.state === 'done') {
        top.appendChild(act('Show in folder', IC.folder, () => ipc({cmd: 'download_show', key: d.key})));
        // Click opens the file with its default app — the drag handler
        // below is what a press-and-move becomes instead.
        row.onclick = (e) => {
          if (e.target.closest('.act')) return;
          ipc({cmd: 'download_open', key: d.key});
        };
        armDrag(row, d.key);
      } else {
        const b = document.createElement('button');
        b.className = 'act retry';
        b.textContent = 'Retry';
        b.onclick = () => ipc({cmd: 'download_retry', key: d.key});
        top.appendChild(b);
      }
      row.appendChild(top);
      const meta = document.createElement('div');
      meta.className = 'meta';
      const bytes = fmtBytes(d.received) + (d.total ? ' / ' + fmtBytes(d.total) : '');
      if (d.state === 'progress') {
        meta.textContent = (d.total ? Math.round(100 * d.received / d.total) + '% — ' : '') + bytes;
      } else if (d.state === 'paused') {
        meta.textContent = 'Paused — ' + bytes;
      } else if (d.state === 'done') {
        meta.textContent = fmtBytes(d.received);
      } else {
        meta.textContent = d.state === 'cancelled' ? 'Cancelled' : 'Interrupted';
      }
      row.appendChild(meta);
      dlPop.appendChild(row);
    }
    if (dls.some((d) => d.state !== 'progress' && d.state !== 'paused')) {
      const c = document.createElement('div');
      c.className = 'mi';
      c.textContent = 'Clear finished';
      c.onclick = () => ipc({cmd: 'downloads_clear'});
      dlPop.appendChild(c);
    }
  };

  // ===== The library panel: kept pages, saved passwords, import, export
  // Every list it shows is pushed by the app (`__cryo_library`); nothing
  // here reads storage, and a password only ever arrives one at a time
  // through `__cryo_secret`, after the app has asked the user.
  const libEl = document.getElementById('lib');
  const libBody = libEl.querySelector('.body');
  const libPanel = libEl.querySelector('.panel');
  const toast = document.getElementById('toast');
  let libPane = 'bookmarks';
  let libData = {pane: 'bookmarks', bookmarks: [], passwords: [], history: [],
                 sources: []};
  let libFilter = '';
  let bookmarkScope = 'all';
  let bookmarkSort = 'newest';
  // Secrets the user revealed in this sitting, keyed origin + username.
  // Cleared when the panel closes, so reopening hides them again.
  const revealed = new Map();
  const rowKey = (origin, username) => origin + '\n' + username;

  // Clicks inside the panel are the panel's; a click on the dimmed
  // backdrop lands on the document and dismisses, like the menu.
  libPanel.onclick = (e) => e.stopPropagation();
  for (const btn of libEl.querySelectorAll('.tab-btn[data-pane]')) {
    btn.onclick = () => openLib(btn.dataset.pane);
  }
  libEl.querySelector('.close').onclick = () => setLib(false);

  const node = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    // Always textContent: every string here came from a web page's
    // title, a file someone else wrote, or a password.
    if (text !== undefined) n.textContent = text;
    return n;
  };

  const button = (label, cls, onclick) => {
    const b = node('button', 'lbtn' + (cls ? ' ' + cls : ''), label);
    b.onclick = onclick;
    return b;
  };

  // A real <select>'s popup renders with OS chrome and can't take the
  // theme — dropdowns are button + listbox. `options` is [[value, label]];
  // onpick gets the value. Escape or any panel click outside closes it.
  const XDROP_CHEVRON = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>';
  const xdrop = (options, current, onpick, label) => {
    const wrap = node('div', 'xdrop');
    const btn = node('button', 'xdrop-btn');
    btn.type = 'button';
    if (label) btn.setAttribute('aria-label', label);
    btn.setAttribute('aria-haspopup', 'listbox');
    const txt = node('span');
    btn.append(txt, node('span', 'xdrop-chev'));
    btn.lastChild.innerHTML = XDROP_CHEVRON;
    const pop = node('div', 'xdrop-pop');
    pop.setAttribute('role', 'listbox');
    let value = current;
    const paint = () => {
      txt.textContent = (options.find(([v]) => v === value) || [])[1] || value;
      [...pop.children].forEach((el, i) =>
        el.classList.toggle('on', options[i][0] === value));
    };
    const close = () => wrap.classList.remove('open');
    for (const [v, l] of options) {
      const item = node('button', 'xdrop-item', l);
      item.type = 'button';
      item.setAttribute('role', 'option');
      item.onclick = (e) => {
        e.stopPropagation();
        value = v; paint(); close(); onpick(v);
      };
      pop.appendChild(item);
    }
    btn.onclick = (e) => {
      e.stopPropagation();
      const was = wrap.classList.contains('open');
      libPanel.querySelectorAll('.xdrop.open').forEach((d) => d.classList.remove('open'));
      wrap.classList.toggle('open', !was);
    };
    wrap.onkeydown = (e) => { if (e.key === 'Escape') close(); };
    paint();
    wrap.append(btn, pop);
    return wrap;
  };
  // A panel click that lands outside an open dropdown tucks it — the
  // panel eats document clicks, so the dismissal lives here.
  libPanel.addEventListener('click', (e) => {
    libPanel.querySelectorAll('.xdrop.open').forEach((d) => {
      if (!d.contains(e.target)) d.classList.remove('open');
    });
  });

  const paintBookmarks = () => {
    const shell = node('div', 'bookmark-shell');
    const folders = node('aside', 'bookmark-folders');
    folders.appendChild(node('h3', '', 'Browse'));
    const main = node('section', 'bookmark-main');
    const top = node('div', 'bookmark-top');
    const titlebar = node('div', 'bookmark-titlebar');
    const heading = node('div');
    heading.append(node('h2', '', 'Bookmarks'), node('div', 'bookmark-subtitle',
      libData.bookmarks.length + (libData.bookmarks.length === 1 ? ' saved page' : ' saved pages')));
    const importBtn = button('Import', 'bookmark-import', () => openLib('import'));
    titlebar.append(heading, importBtn);

    const searchRow = node('div', 'bookmark-search-row');
    const searchWrap = node('div', 'bookmark-search-wrap');
    searchWrap.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>';
    const search = node('input', 'bookmark-search');
    search.type = 'search';
    search.spellcheck = false;
    search.placeholder = 'Search title, website, or folder';
    search.setAttribute('aria-label', 'Search bookmarks');
    search.value = libFilter;
    const clear = node('button', 'search-clear' + (libFilter ? ' show' : ''), '×');
    clear.title = 'Clear search';
    clear.onclick = () => {
      libFilter = ''; search.value = ''; clear.classList.remove('show'); paintRows(); search.focus();
    };
    searchWrap.append(search, clear);
    const sort = xdrop(
      [['newest', 'Newest'], ['az', 'A–Z'], ['site', 'Website']],
      bookmarkSort, (v) => { bookmarkSort = v; paintRows(); }, 'Sort bookmarks');
    searchRow.append(searchWrap, sort);
    top.append(titlebar, searchRow);
    const list = node('div', 'bookmark-results');
    main.append(top, list);
    shell.append(folders, main);
    libBody.appendChild(shell);

    const folderCounts = new Map();
    for (const b of libData.bookmarks) {
      const key = b.folder || '';
      folderCounts.set(key, (folderCounts.get(key) || 0) + 1);
    }
    if (bookmarkScope !== 'all' && !folderCounts.has(bookmarkScope)) bookmarkScope = 'all';
    const folderIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 6.5h6l2 2h9v9.5a2 2 0 0 1-2 2h-15z"/></svg>';
    const scopeButton = (key, label, count, icon) => {
      const b = node('button', 'folder-btn' + (bookmarkScope === key ? ' on' : ''));
      b.title = label;
      b.innerHTML = icon || folderIcon;
      b.append(node('span', 'folder-name', label), node('span', 'folder-count', String(count)));
      b.onclick = () => { bookmarkScope = key; paintLib(); };
      folders.appendChild(b);
    };
    scopeButton('all', 'All bookmarks', libData.bookmarks.length,
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>');
    if (folderCounts.has('')) scopeButton('', 'Bookmarks bar', folderCounts.get(''));
    [...folderCounts.entries()].filter(([name]) => name).sort((a, b) => a[0].localeCompare(b[0]))
      .forEach(([name, count]) => scopeButton(name, name, count));

    const paintRows = () => {
      list.innerHTML = '';
      const needle = libFilter.trim().toLowerCase();
      const rows = libData.bookmarks.filter((b) =>
        (bookmarkScope === 'all' || b.folder === bookmarkScope) && (!needle ||
        (b.title + ' ' + b.url + ' ' + b.folder).toLowerCase().includes(needle)));
      const host = (url) => {
        try { return new URL(url).hostname.replace(/^www\./, '') || url; } catch (_) { return url; }
      };
      rows.sort((a, b) => bookmarkSort === 'az' ? a.title.localeCompare(b.title)
        : bookmarkSort === 'site' ? host(a.url).localeCompare(host(b.url))
        : (b.added_at || 0) - (a.added_at || 0));
      if (!rows.length) {
        const empty = node('div', 'bookmark-empty');
        const copy = node('div');
        copy.append(node('div', 'bookmark-empty-mark', needle ? '⌕' : '☆'),
          node('h3', '', libData.bookmarks.length ? 'No bookmarks found' : 'Your library is ready'),
          node('p', '', libData.bookmarks.length
            ? 'Try another search or choose a different folder.'
            : 'Save any page with Ctrl+D, or import bookmarks from another browser.'));
        empty.appendChild(copy); list.appendChild(empty);
        return;
      }
      list.appendChild(node('div', 'bookmark-summary', rows.length +
        (rows.length === 1 ? ' result' : ' results')));
      for (const b of rows) {
        const r = node('div', 'bookmark-card');
        r.tabIndex = 0; r.title = b.url;
        const site = host(b.url);
        const mark = node('div', 'site-mark');
        const hue = [...site].reduce((n, c) => n + c.charCodeAt(0), 0) % 360;
        mark.style.background = 'hsl(' + hue + ' 28% 25%)';
        // The site's icon on the tile when one has arrived; the letter
        // stays for pages never visited (or visited before v2).
        if (b.favicon) {
          const img = node('img', 'site-fav');
          img.src = b.favicon;
          img.alt = '';
          img.draggable = false;
          mark.appendChild(img);
        } else {
          mark.textContent = site[0] || b.title[0] || '?';
        }
        const copy = node('div', 'bookmark-copy');
        const meta = node('div', 'bookmark-meta');
        meta.appendChild(node('span', 'bookmark-host', site));
        if (b.folder) meta.appendChild(node('span', 'bookmark-folder-pill', b.folder));
        copy.append(node('div', 'bookmark-name', b.title), meta);
        const actions = node('div', 'bookmark-actions');
        const newTab = node('button', 'icon-btn');
        newTab.title = 'Open in background tab';
        newTab.setAttribute('aria-label', 'Open ' + b.title + ' in background tab');
        newTab.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></svg>';
        newTab.onclick = (e) => {
          e.stopPropagation(); ipc({cmd: 'bookmark_open', id: b.id, ctrl: true, shift: true});
        };
        const remove = node('button', 'icon-btn danger');
        remove.title = 'Remove bookmark'; remove.setAttribute('aria-label', 'Remove ' + b.title);
        remove.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg>';
        remove.onclick = (e) => {
          e.stopPropagation(); actions.innerHTML = '';
          const check = node('div', 'delete-check', 'Remove?');
          const no = node('button', 'no', 'Cancel');
          no.onclick = (ev) => { ev.stopPropagation(); paintRows(); };
          const yes = node('button', 'yes', 'Remove');
          yes.onclick = (ev) => { ev.stopPropagation(); ipc({cmd: 'bookmark_remove', id: b.id}); };
          check.append(no, yes); actions.appendChild(check);
        };
        actions.append(newTab, remove);
        r.append(mark, copy, actions);
        r.onclick = (e) => ipc({cmd: 'bookmark_open', id: b.id, ctrl: e.ctrlKey, shift: e.shiftKey});
        r.onkeydown = (e) => { if (e.key === 'Enter') r.click(); };
        list.appendChild(r);
      }
      if (libData.more_bookmarks) {
        list.appendChild(node('div', 'lnote',
          'Showing the first ' + libData.bookmarks.length + ' of ' +
          (libData.bookmarks.length + libData.more_bookmarks) + ' kept.'));
      }
    };
    search.oninput = () => {
      libFilter = search.value; clear.classList.toggle('show', !!libFilter); paintRows();
    };
    search.onkeydown = (e) => {
      if (e.key === 'Enter') list.querySelector('.bookmark-card')?.click();
      if (e.key === 'ArrowDown') { e.preventDefault(); list.querySelector('.bookmark-card')?.focus(); }
    };
    paintRows();
    setTimeout(() => search.focus(), 0);
  };

  const paintPasswords = () => {
    if (libData.locked) {
      libBody.appendChild(node('div', 'lnote warn',
        'The vault could not be opened: ' + libData.locked +
        ' — it is sealed to the Windows account that wrote it. ' +
        'Nothing will be overwritten.'));
    }
    if (!libData.passwords.length) {
      libBody.appendChild(node('div', 'lempty',
        'No saved passwords. Export them from your old browser and bring the CSV over in the Import pane.'));
    }
    for (const p of libData.passwords) {
      const key = rowKey(p.origin, p.username);
      const shown = revealed.get(key);
      const r = node('div', 'lrow');
      const main = node('div', 'main');
      main.append(node('div', 't', p.origin),
                  node('div', 'u', p.username || '(no username)'));
      r.appendChild(main);
      r.appendChild(node('div', 'dots', shown === undefined
        ? '•'.repeat(Math.min(p.length, 16)) : shown));
      if (shown === undefined) {
        r.appendChild(button('Reveal', '', () =>
          ipc({cmd: 'password_reveal', origin: p.origin, username: p.username})));
      } else {
        r.appendChild(button('Hide', '', () => { revealed.delete(key); paintLib(); }));
        r.appendChild(button('Copy', '', () => {
          navigator.clipboard.writeText(shown).catch(() => {});
        }));
      }
      r.appendChild(button('Forget', 'warn', () =>
        ipc({cmd: 'password_remove', origin: p.origin, username: p.username})));
      libBody.appendChild(r);
    }
    if (libData.more_passwords) {
      libBody.appendChild(node('div', 'lnote',
        'Showing the first ' + libData.passwords.length + ' of ' +
        (libData.passwords.length + libData.more_passwords) + ' saved.'));
    }
    libBody.appendChild(node('div', 'lnote',
      'Saved passwords are sealed with your Windows account, so the file is unreadable on any other. ' +
      'cryo does not offer to save passwords from forms yet — this list is what you import, and what Export writes.'));
  };

  const paintHistory = () => {
    if (libData.incognito) {
      libBody.appendChild(node('div', 'lnote warn',
        'This is an incognito window: it keeps nothing — there is no history to show.'));
      return;
    }
    const entries = libData.history || [];
    const head = node('div', 'lrow');
    head.style.borderBottom = '0';
    const heading = node('div', 'main');
    heading.appendChild(node('div', 't',
      entries.length + (entries.length === 1 ? ' remembered address' : ' remembered addresses')));
    head.appendChild(heading);
    if (entries.length) {
      head.appendChild(button('Clear history', 'warn', () => ipc({cmd: 'history_clear'})));
    }
    libBody.appendChild(head);
    if (!entries.length) {
      libBody.appendChild(node('div', 'lempty',
        'Nothing yet — addresses you visit or commit in the address bar land here.'));
      return;
    }
    const search = node('input', 'search');
    search.type = 'search';
    search.spellcheck = false;
    search.placeholder = 'Search history';
    search.setAttribute('aria-label', 'Search history');
    libBody.appendChild(search);
    const list = node('div');
    libBody.appendChild(list);
    const paintRows = () => {
      list.innerHTML = '';
      const needle = search.value.trim().toLowerCase();
      const rows = entries.filter((e) => !needle ||
        (e.text + ' ' + (e.title || '')).toLowerCase().includes(needle));
      if (!rows.length) {
        list.appendChild(node('div', 'lempty', 'No matches.'));
        return;
      }
      let lastDay = null;
      for (const e of rows) {
        const when = new Date(e.last_seen * 1000);
        const day = when.toLocaleDateString(undefined,
          {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'});
        if (day !== lastDay) {
          lastDay = day;
          list.appendChild(node('div', 'lhead', day));
        }
        const r = node('div', 'lrow');
        r.tabIndex = 0;
        r.title = e.text;
        if (e.favicon) {
          const img = node('img', 'site-fav');
          img.src = e.favicon;
          img.alt = '';
          img.draggable = false;
          img.style.width = '16px'; img.style.height = '16px';
          r.appendChild(img);
        }
        const main = node('div', 'main');
        main.append(node('div', 't', e.title || e.text), node('div', 'u', e.text));
        r.appendChild(main);
        r.appendChild(node('div', 'fold', when.toLocaleTimeString(undefined,
          {hour: '2-digit', minute: '2-digit'}) + (e.uses > 1 ? ' · ' + e.uses + ' visits' : '')));
        const forget = button('Forget', 'warn', (ev) => {
          ev.stopPropagation();
          ipc({cmd: 'history_remove', text: e.text});
        });
        r.appendChild(forget);
        r.onclick = (ev) =>
          ipc({cmd: 'history_open', url: e.text, ctrl: ev.ctrlKey, shift: ev.shiftKey});
        r.onkeydown = (ev) => { if (ev.key === 'Enter') r.click(); };
        list.appendChild(r);
      }
      if (libData.more_history) {
        list.appendChild(node('div', 'lnote',
          'Showing the first ' + entries.length + ' of ' +
          (entries.length + libData.more_history) + ' remembered.'));
      }
    };
    search.oninput = paintRows;
    paintRows();
    setTimeout(() => search.focus(), 0);
  };

  const paintImport = () => {
    if (libData.incognito) {
      libBody.appendChild(node('div', 'lnote warn',
        'This is an incognito window: it keeps nothing after it closes. Import from a normal window.'));
    }
    libBody.appendChild(node('div', 'lhead', 'From a file'));
    const pick = node('div', 'lrow');
    pick.appendChild(node('div', 'main',
      'Bookmarks (.html), passwords (.csv) or a cryo history export (.csv). cryo reads the file to see which it is.'));
    const pickBtn = button('Choose a file…', '', () => ipc({cmd: 'import_file'}));
    pickBtn.disabled = !!libData.incognito;
    pick.appendChild(pickBtn);
    libBody.appendChild(pick);

    libBody.appendChild(node('div', 'lhead', 'Installed browsers'));
    if (!libData.sources_ready) {
      libBody.appendChild(node('div', 'lempty', 'Looking for installed browsers…'));
    } else if (!libData.sources.length) {
      libBody.appendChild(node('div', 'lempty',
        'No Edge, Chrome, Brave, Vivaldi or Opera profile found on this machine.'));
    }
    for (const s of libData.sources) {
      const r = node('div', 'lrow');
      const main = node('div', 'main');
      main.append(node('div', 't', s.browser + ' · ' + s.profile),
                  node('div', 'u', s.count + (s.count === 1 ? ' bookmark' : ' bookmarks')));
      r.appendChild(main);
      const go = button('Import bookmarks', '', () =>
        ipc({cmd: 'import_profile', index: s.index}));
      go.disabled = !!libData.incognito;
      r.appendChild(go);
      libBody.appendChild(r);
    }
    libBody.appendChild(node('div', 'lnote',
      'Bookmarks are read straight out of the other browser’s profile. ' +
      'Passwords are not: they sit in that browser’s own encrypted store, locked to its account. ' +
      'Export them from its settings — Edge: edge://settings/passwords, Chrome: chrome://password-manager/passwords — and choose that CSV above.'));
  };

  const paintExport = () => {
    if (libData.incognito) {
      libBody.appendChild(node('div', 'lnote warn',
        'An incognito window has nothing stored to export.'));
    }
    const kinds = [
      ['bookmarks', 'Bookmarks', 'A Netscape bookmark file (.html) — every browser imports it.', ''],
      ['passwords', 'Passwords', 'Chrome’s CSV layout. Written in plain text: anyone who opens the file can read every password.', 'warn'],
      ['history', 'History', 'cryo’s own CSV (url, title, visits, last visit), so a profile can move machines.', ''],
    ];
    for (const [what, title, blurb, cls] of kinds) {
      const r = node('div', 'lrow');
      const main = node('div', 'main');
      main.append(node('div', 't', title), node('div', 'u', blurb));
      r.appendChild(main);
      const go = button('Export…', cls, () => ipc({cmd: 'export', what}));
      go.disabled = !!libData.incognito;
      r.appendChild(go);
      libBody.appendChild(r);
    }
  };

  const paintLib = () => {
    for (const btn of libEl.querySelectorAll('.tab-btn[data-pane]')) {
      btn.classList.toggle('on', btn.dataset.pane === libPane);
    }
    libBody.innerHTML = '';
    libBody.classList.toggle('bookmarks-body', libPane === 'bookmarks');
    if (libPane === 'bookmarks') paintBookmarks();
    else if (libPane === 'passwords') paintPasswords();
    else if (libPane === 'history') paintHistory();
    else if (libPane === 'import') paintImport();
    else paintExport();
  };

  window.__cryo_library = (data) => {
    libData = data;
    libPane = data.pane;
    paintLib();
  };

  // One password, for one click. The app has already asked the user.
  window.__cryo_secret = (reply) => {
    revealed.set(rowKey(reply.origin, reply.username), reply.secret);
    if (libOpen) paintLib();
  };

  let toastTimer = null;
  window.__cryo_notice = (n) => {
    toast.innerHTML = '';
    toast.appendChild(node('div', 'tt', n.title));
    for (const line of n.lines || []) toast.appendChild(node('div', 'tl', line));
    toast.classList.toggle('bad', !n.ok);
    toast.classList.add('open');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('open'), 7000);
  };
  toast.onclick = () => toast.classList.remove('open');

  document.getElementById('star').onclick = () => ipc({cmd: 'bookmark_page'});

  // Shelf-only pushes: progress ticks repaint the shelf without paying
  // for a whole-state sync. lastState stays in step so the next full
  // update's started/settled diffing still sees the truth.
  window.__cryo_dl = (rows) => {
    renderDl(rows || [], lastState);
    lastState.downloads = rows || [];
  };

  window.__cryo_update = (state) => {
    const prev = lastState;
    lastState = state;
    tabsEl.innerHTML = '';
    for (const t of state.tabs) {
      const el = document.createElement('div');
      el.className = 'tab' + (t.active ? ' active' : '') +
                     (t.state !== 'active' ? ' ' + t.state : '');
      el.title = t.state === 'frozen' ? 'Frozen — click to restore'
               : t.state === 'discarded' ? 'Discarded — click to reload' : '';
      // Middle-click anywhere on the tab closes it.
      el.addEventListener('auxclick', (e) => {
        if (e.button === 1) ipc({cmd: 'close', id: t.id});
      });
      // A loading tab spins in the icon slot; once settled the site
      // icon leads the tab in every state — the strip badges the page,
      // not the surface's liveness.
      if (t.loading) {
        const spin = document.createElement('span');
        spin.className = 'spin';
        el.appendChild(spin);
      } else if (t.favicon) {
        const img = document.createElement('img');
        img.className = 'fav';
        img.src = t.favicon;
        img.alt = '';
        el.appendChild(img);
      }
      // Live tabs get a freeze button; a frozen tab shows the same flake
      // as a state marker (clicking the tab restores).
      if (t.state === 'active') {
        const fz = document.createElement('span');
        fz.className = 'fz';
        fz.textContent = '❄';
        fz.title = 'Freeze tab (Ctrl+Shift+F)';
        fz.onclick = () => ipc({cmd: 'freeze', id: t.id});
        el.appendChild(fz);
      } else if (t.state === 'frozen') {
        const mark = document.createElement('span');
        mark.className = 'fzmark';
        mark.textContent = '❄';
        el.appendChild(mark);
      }
      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = t.title;
      title.onclick = () => ipc({cmd: 'activate', id: t.id});
      const x = document.createElement('span');
      x.className = 'x';
      x.textContent = '×';
      x.onclick = () => ipc({cmd: 'close', id: t.id});
      el.append(title, x);
      tabsEl.appendChild(el);
    }
    if (document.activeElement !== urlEl) urlEl.value = state.active_url;
    // Loading state: the active tab's flag swaps reload for ✕ and runs
    // the indeterminate bar; background tabs only spin their own icon.
    const active = state.tabs.find((t) => t.active);
    const loading = !!(active && active.loading);
    reloadBtn.classList.toggle('loading', loading);
    reloadBtn.title = loading ? 'Stop loading (Esc)' : 'Reload (F5)';
    loadbar.classList.toggle('on', loading);
    // The arrows grey out where history has nowhere to step.
    backBtn.disabled = !state.can_back;
    fwdBtn.disabled = !state.can_fwd;
    const menuBtn = document.getElementById('menu');
    menuBtn.classList.toggle('has-update', !!state.update_version);
    if (state.update_version) {
      updateItem.textContent = 'Restart to update — v' + state.update_version;
      menuPop.prepend(updateItem);
    } else {
      updateItem.remove();
    }
    renderDl(state.downloads || [], prev);
    // The bar shows kept pages once there are any, the dial list until
    // then; the ★ fills in while this page is one of them.
    renderBar(state.bookmarks || []);
    const star = document.getElementById('star');
    star.classList.toggle('on', !!state.starred);
    star.title = state.starred
      ? 'Remove bookmark (Ctrl+D)' : 'Bookmark this page (Ctrl+D)';
    // The account button mirrors the profile's Google session: the
    // picture (or an initial) when signed in, the pill when not.
    const signin = document.getElementById('signin');
    if (state.account) {
      const key = state.account.name + '|' + (state.account.avatar || '');
      if (signin.dataset.k !== key) {
        signin.dataset.k = key;
        signin.innerHTML = '';
        if (state.account.avatar) {
          const img = document.createElement('img');
          img.className = 'ava';
          img.src = state.account.avatar;
          img.alt = '';
          signin.appendChild(img);
        } else {
          const dot = document.createElement('span');
          dot.className = 'initial';
          dot.textContent =
            Array.from(state.account.name.trim())[0]?.toUpperCase() || '?';
          signin.appendChild(dot);
        }
      }
      signin.classList.add('signed');
      signin.title = state.account.email
        ? 'Google account — ' + state.account.email
        : 'Google account — ' + state.account.name;
    } else {
      signin.classList.remove('signed');
      delete signin.dataset.k;
      signin.textContent = 'Sign in';
      signin.title = 'Sign in with your Google account';
    }
  };
</script>
</body>
</html>
