<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<link rel="icon" type="image/svg+xml" href="/theme/icon-glacier.svg">
<link rel="stylesheet" href="/theme/tokens.css">
<script src="/theme/theme.js"></script>
<link rel="stylesheet" href="/newtab/newtab.css">
</head>
<body>
  <div id="field" aria-hidden="true">
    <span class="lobe l1"></span><span class="lobe l2"></span><span class="lobe l3"></span>
  </div>
  <div id="lattice" aria-hidden="true"></div>
  <div id="clock">
    <div class="time" id="clock-time"></div>
    <div class="date" id="clock-date"></div>
  </div>
  <main>
    <div class="mark">
      <span class="halo" aria-hidden="true"></span>
      <span class="crystal" aria-hidden="true"></span>
    </div>
    <div class="brand">cryo</div>
    <div class="tag">Tabs freeze. Budgets hold.</div>
    <form id="go" autocomplete="off">
      <div class="box" id="box">
        <span id="chip">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none"
               stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="7" cy="7" r="4.4"/><path d="M10.4 10.4 14 14"/>
          </svg>
          <span id="chip-name">DuckDuckGo</span>
        </span>
        <input id="q" type="text" spellcheck="false" autofocus
               placeholder="Search or type a URL" aria-label="Search or type a URL">
        <span class="enter" aria-hidden="true">&#8629;</span>
      </div>
    </form>
    <div id="dial"></div>
    <div id="scrim" hidden>
      <form id="editor" autocomplete="off" role="dialog" aria-modal="true"
            aria-labelledby="e-title">
        <h2 id="e-title">Add a tile</h2>
        <label for="e-name">Name</label>
        <input id="e-name" type="text" maxlength="24" placeholder="Docs">
        <label for="e-url">Address</label>
        <input id="e-url" type="text" placeholder="docs.rs">
        <p id="e-error" role="alert" hidden>That address does not parse.</p>
        <div class="row">
          <button type="button" id="e-cancel">Cancel</button>
          <button type="submit" class="go">Add</button>
        </div>
      </form>
    </div>
    <div class="soon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 16" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
        <rect x="1" y="1.4" width="18" height="13.2" rx="2.4"/><path d="m1.8 3.4 8.2 5.6 8.2-5.6"/>
      </svg>
      <span>Mail, built in. Your own IMAP inbox.</span>
      <span class="badge">Soon</span>
    </div>
    <p class="hint">
      <kbd>/</kbd> to search<span class="sep">&middot;</span>
      <span id="dial-hint" hidden><kbd>1</kbd>-<kbd id="dial-max">6</kbd> to open a tile</span>
    </p>
    <button type="button" id="reset" class="link" hidden>Restore the default tiles</button>
  </main>
<script src="/newtab/newtab.js"></script>
</body>
</html>
