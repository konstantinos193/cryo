[package]
name = "cryo"
version = "0.7.0"
edition = "2021"
description = "A memory-obsessed browser shell written in Rust. Tabs freeze. Budgets hold."
license = "MIT"
repository = "https://github.com/konstantinos193/cryo"

[dependencies]
anyhow = "1"
raw-window-handle = "0.6"
# gtk3 backend on Linux (gtk is already linked via tao/wry); the native
# backends on Windows and macOS are unconditional inside rfd.
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tao = "0.37"
thiserror = "2"
ureq = "3.5"
wry = "0.57"
url = "2"
# Scrubs plaintext out of dropped heap — the vault's Secret and Draft.
zeroize = "1"

# The vault protector off Windows: a random key in the OS keychain
# (Secret Service / Keychain) sealing vault bytes with XChaCha20-Poly1305.
[target.'cfg(not(target_os = "windows"))'.dependencies]
chacha20poly1305 = "0.11"
getrandom = "0.4"
keyring = "4"

[target.'cfg(target_os = "windows")'.dependencies]
# Direct dep because the `windows::core::implement` macro expands to
# code naming the `windows_core` crate by name.
windows-core = "0.62.2"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"
