[package]
name = "cryo"
version = "0.19.0"
edition = "2021"
description = "A memory-obsessed browser shell written in Rust. Tabs freeze. Budgets hold."
license = "MIT"
repository = "https://github.com/konstantinos193/cryo"

[dependencies]
anyhow = "1"
raw-window-handle = "0.6"
# gtk3 backend on Linux (gtk is already linked via tao/wry); the native
# backends on Windows and macOS are unconditional inside rfd.
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tao = "0.37"
thiserror = "2"
ureq = "3.5"
wry = "0.57"
url = "2"
# Scrubs plaintext out of dropped heap — the vault's Secret and Draft.
zeroize = "1"
# Phase 5: the Servo backend. `image` only encodes PNG for favicons and
# screenshots; `servo` is the embedding crate. Behind `--features
# servo-engine` so the wry default never pays the mozjs/clang build.
servo = { version = "0.7.0", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
dpi = { version = "0.1", optional = true }
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The mail context's plumbing: a synchronous IMAP client on the mail
# worker's thread (no second runtime, AGENTS §9), schannel TLS on
# Windows via native-tls, lettre for SMTP send, mail-parser for MIME.
imap = "3.0.0-alpha.15"
# imap 3 stops re-exporting the LIST attribute enum; `mail::folder`
# names it directly. Pinned to the version imap itself resolves.
imap-proto = "0.16.7"
lettre = { version = "0.11.23", default-features = false, features = [
    "builder",
    "smtp-transport",
    "native-tls",
    "hostname",
] }
mail-parser = "0.11.9"
# Inline (`cid:`) images are re-encoded as data URLs for the reading
# pane — the sanitizer lets self-contained images through, never a part
# id the page would have to fetch.
base64 = "0.23"
# Sanitizes message HTML before it reaches the /mail document — the only
# thing standing between a hostile sender and the shell's own origin.
ammonia = "4.2.4"

[features]
servo-engine = ["dep:servo", "dep:image", "dep:dpi"]

# The vault protector off Windows: a random key in the OS keychain
# (Secret Service / Keychain) sealing vault bytes with XChaCha20-Poly1305.
[target.'cfg(not(target_os = "windows"))'.dependencies]
chacha20poly1305 = "0.11"
getrandom = "0.4"
keyring = "4"

# libproc for memory accounting (proc_listchildpids, proc_pid_rusage).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "windows")'.dependencies]
# Direct dep because the `windows::core::implement` macro expands to
# code naming the `windows_core` crate by name.
windows-core = "0.62.2"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "UI_Notifications",
    "Data_Xml_Dom",
] }

[build-dependencies]
embed-resource = "3.0.12"

# glib 0.18.5 with the upstream VariantStrIter fix (GHSA-wrw7-89jp-8q8g:
# the out-pointer was passed as `&p`, not `&mut p`). Nothing newer is
# reachable — wry 0.57 and tao 0.37 bind GTK3 through gtk-rs 0.18, which
# pins glib ^0.18, and the fix only shipped in 0.20. Linux-only; the
# crate never compiles for Windows or macOS. Two lines differ from the
# registry crate: the fix, and `#![allow(warnings)]` in its lib.rs, since
# a path crate gets no `--cap-lints` and CI runs clippy at -D warnings.
# CodeQL skips the folder (.github/codeql/codeql-config.yml). Drop all of
# it the day wry moves to a gtk that takes glib ≥ 0.20.
[patch.crates-io]
glib = { path = "patches/glib" }
