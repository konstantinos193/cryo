[package]
name = "cryo"
version = "0.0.1"
edition = "2021"
description = "A memory-obsessed browser shell written in Rust. Tabs freeze. Budgets hold."
license = "MIT"
repository = "https://github.com/konstantinos193/cryo"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
thiserror = "2"
wry = "0.57"

[target.'cfg(target_os = "windows")'.dependencies]
rfd = "0.15"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
embed-resource = "3.0.1"
